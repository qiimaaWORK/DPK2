<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form dengan tabel</title>
</head>
<body>
    <h2>Form Biodata Peserta</h2>
    <form action="form2.html">
        <table width="323" height="191" border="0">
            <tr>
                <td>Nama</td>
                <td>:</td>
                <td><input type="text" name="nama" id="nama"/></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td><input type="radio" name="jk" id="radio" value="wanita" />Wanita</td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td><input type="radio" name="jk" id="radio2" value="pria"/><label for="jk">Pria</label></td>
            </tr>

            <tr>
                <td>Hobby</td>
                <td>:</td>
                <td><input type="checkbox" name="hobby" id="hobby" />Membaca</td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td><input type="checkbox" name="hobby" id="hobby" />Olahraga</td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td><input type="checkbox" name="hobby" id="hobby" />Musik</td>
            </tr>

            <tr>
                <td>Golongan darah</td>
                <td>:</td>
                <td><label for="goldarah"></label>
                    <select name="goldarah" id="goldarah">
                        <option value="A">a</option>
                        <option value="B">b</option>
                        <option value="AB">ab</option>
                        <option value="O">o</option>
                    </select></td>
            </tr>

            <tr>
                <td>Alamat</td>
                <td>:</td>
                <td><label for="alamat"></label>
                <textarea name="alamat" id="alamat" cols="45" rows="5"></textarea></td>
            </tr>

             <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td><input type="submit" name="tombol" id="tombol" value="Sumbit" /><input type="reset" name="tombol" id="tombol" value="Reset"/></td>
            </tr>
        </table>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
    </form>
    <p>&nbsp;</p>
</body>
</html>
