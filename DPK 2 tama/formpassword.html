<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
</head>
<body>
    <form action="forminputtext.html">
        <fieldset>
        <legend>Form login</legend>
        <label for="username">Usermame :</label><br>
        <input name="username" type="text" id="username" maxlength="25"><br><br>

        <label for="pass">Password :</label><br>
        <input name="pass" type="password" id="pass" maxlength="8"><br><br>
        <input type="submit" name="btn" id="button" value="Submit">
        <input type="submit" name="btn" id="btn" value="Reset">
        </fieldset>
    </form>
    <p>&nbsp;</p>
</body>
</html>
